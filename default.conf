map $http_x_forwarded_proto $staff_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /admin {
        return 302 /admin/;
    }

    location ^~ /admin/ {
        auth_request /_staff_session;
        error_page 401 = @staff_signin;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ =404;
    }

    location @staff_signin {
        return 302 /login/;
    }

    location = /_staff_session {
        internal;
        proxy_pass http://127.0.0.1:3001/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $staff_scheme;
    }

    location = /auth/login {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3001/login;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $staff_scheme;
    }

    location = /auth/logout {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3001/logout;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $staff_scheme;
    }

    location = /auth/options {
        proxy_pass http://127.0.0.1:3001/options;
    }
    location = /auth { return 404; }
    location /auth/ { return 404; }

    location = /login { return 302 /login/; }
    location ^~ /login/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

