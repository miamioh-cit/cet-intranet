server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /admin {
        return 302 /admin/;
    }

    location ^~ /admin/ {
        auth_basic "CET staff";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

