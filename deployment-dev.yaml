apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-deployment
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: cithit/cit-intranet:latest # This is pulling from dockerhub   
        ports:
        - containerPort: 80  # Expose NGINX on port 80      
        volumeMounts:
        - name: admin-auth
          mountPath: /etc/nginx/auth
          readOnly: true
      volumes:
      - name: admin-auth
        secret:
          secretName: intranet-admin-auth
          optional: true
          defaultMode: 0444
          items:
          - key: htpasswd
            path: htpasswd
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
spec:
  rules: 
  - host: 
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend: 
          service:
            name: dev-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dev-service
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: nginx 

