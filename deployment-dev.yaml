apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-deployment
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        intranet-environment: dev
    spec:
      serviceAccountName: intranet-dev-staff-auth
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: cithit/cit-intranet:latest # This is pulling from dockerhub   
        ports:
        - containerPort: 80  # Expose NGINX on port 80      
        volumeMounts:
        - name: admin-auth
          mountPath: /etc/nginx/auth
          readOnly: true
      - name: staff-auth
        image: cithit/cit-intranet:latest
        command: ["node", "/app/auth/server.cjs"]
        env:
        - name: AUTH_ALLOW_HTTP
          value: "true" # Temporary until the HTTPS certificate is installed.
        - name: AUTH_ACCOUNT_STORAGE
          value: "kubernetes"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: "1"
            memory: 128Mi
        volumeMounts:
        - name: admin-auth
          mountPath: /etc/nginx/auth
          readOnly: true
        - name: staff-api
          mountPath: /var/run/secrets/staff-api
          readOnly: true
      volumes:
      - name: staff-api
        projected:
          defaultMode: 0444
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: admin-auth
        secret:
          secretName: intranet-admin-auth
          optional: true
          defaultMode: 0444
          items:
          - key: htpasswd
            path: htpasswd
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
spec:
  rules: 
  - host: 
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend: 
          service:
            name: dev-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dev-service
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: nginx 
    intranet-environment: dev


---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intranet-dev-staff-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intranet-dev-staff-auth
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["intranet-admin-auth"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intranet-dev-staff-auth
subjects:
- kind: ServiceAccount
  name: intranet-dev-staff-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: intranet-dev-staff-auth
