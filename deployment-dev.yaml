apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-deployment
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: cithit/cit-intranet:latest # This is pulling from dockerhub   
        ports:
        - containerPort: 80  # Expose NGINX on port 80      
        volumeMounts:
        - name: admin-auth
          mountPath: /etc/nginx/auth
          readOnly: true
      - name: staff-auth
        image: cithit/cit-intranet:latest
        command: ["node", "/app/auth/server.cjs"]
        env:
        - name: AUTH_ALLOW_HTTP
          value: "true" # Temporary until the HTTPS certificate is installed.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: "1"
            memory: 128Mi
        volumeMounts:
        - name: admin-auth
          mountPath: /etc/nginx/auth
          readOnly: true
      volumes:
      - name: admin-auth
        secret:
          secretName: intranet-admin-auth
          optional: true
          defaultMode: 0444
          items:
          - key: htpasswd
            path: htpasswd
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
spec:
  rules: 
  - host: 
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend: 
          service:
            name: dev-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dev-service
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: nginx 

